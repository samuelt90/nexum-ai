<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CV</title>

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 40px;
      color: #1a1a1a;
    }

    .cv {
      max-width: 900px;
      margin: auto;
      background: white;
      display: flex;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Sidebar */
    .sidebar {
      width: 30%;
      background: #f3f3f3;
      padding: 30px;
    }

    .sidebar h3 {
      color: #d97706;
      margin-bottom: 10px;
    }

    .sidebar p,
    .sidebar li {
      font-size: 14px;
      margin-bottom: 8px;
    }

    /* Main */
    .main {
      width: 70%;
      padding: 40px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    .header p {
      margin: 5px 0 20px;
      color: #d97706;
      font-weight: 600;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #d97706;
      border-bottom: 2px solid #eee;
      padding-bottom: 5px;
    }

    .item {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .item strong {
      display: block;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="cv">

  <!-- Sidebar -->
  <div class="sidebar">

    <h3>Contacto</h3>
    {{contacto}}

    <h3>Habilidades</h3>
    <ul>
      {{habilidades}}
    </ul>

  </div>

  <!-- Main -->
  <div class="main">

    <div class="header">
      <h1>{{nombre}}</h1>
      <p>{{profesion}}</p>
    </div>

    <div class="section">
      <h2>Experiencia</h2>
      {{experiencia}}
    </div>

    <div class="section">
      <h2>Educación</h2>
      {{educacion}}
    </div>

    <div class="section">
      <h2>Perfil</h2>
      <p>{{perfil}}</p>
    </div>

  </div>

</div>

</body>
</html>
